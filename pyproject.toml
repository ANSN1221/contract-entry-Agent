[project]
name = "contract-entry-agent"
version = "0.1.0"
description = "合同录入执行 Agent：上传合同 PDF → 抽取字段 → 人工确认 → 写库"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
# 项目一 Contract-qa-RAG（条款双路召回 + 引用校验）以 path 依赖接入。
# 发行名 contract-qa-agent，导入名 contract_qa；缺包时 app/adapters/rag.py 会报清晰错误。
rag = ["contract-qa-agent"]

[tool.uv.sources]
contract-qa-agent = { path = "../Contract-qa-RAG", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
